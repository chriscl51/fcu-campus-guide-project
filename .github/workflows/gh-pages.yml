name: Deploy to GitHub Pages

# Builds client/ (the Vue static site) and deploys client/dist/ to GitHub
# Pages. Separate from azure-static-web-apps.yml — that one deploys the same
# client/ build to Azure instead; this is just an alternate/preview host.
# Requires one manual step: repo Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions" (it defaults to "Deploy from a branch", which is
# what was serving the raw README.md via Jekyll instead of this app).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          # Tells vite.config.js to prefix asset URLs with the GitHub Pages
          # project subpath (/fcu-campus-guide-project/) instead of root.
          GITHUB_PAGES: 'true'

      - name: Disable Jekyll processing
        run: touch client/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
